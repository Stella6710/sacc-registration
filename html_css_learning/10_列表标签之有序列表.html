<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ol type="1">
        <li>苹果</li>
        <li>香蕉</li>
        <li>橙子</li>
        <li>葡萄</li>
    </ol>
    <ol type="A">
        <li>苹果</li>
        <li>香蕉</li>
        <li>橙子</li>
        <li>葡萄</li>
    </ol>
    <ol type="a">
        <li>苹果</li>
        <li>香蕉</li>
        <li>橙子</li>
        <li>葡萄</li>
    </ol>
    <ol type="I">
        <li>苹果</li>
        <li>香蕉</li>
        <li>橙子</li>
        <li>葡萄</li>
    </ol>
    <ol type="i">
        <li>苹果</li>
        <li>香蕉</li>
        <li>橙子</li>
        <li>葡萄</li>
    </ol>

    <p>标签可以嵌套使用</p>
    <ol>
        <li>水果
            <ol type="1">
                <li>苹果</li>
                <li>香蕉</li>
                <li>橙子</li>
                <li>葡萄</li>
            </ol>
        </li>
        <li>蔬菜</li>
        <li>肉类</li>
    </ol>
</body>
</html>
