<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>无序列表快捷键<i>ul>li*4</i></p><br>
    <p>无序列表的type属性</p>
    <ul tpye="disc">
        <li>水果</li>
        <li>蔬菜</li>
        <li>肉类</li>
    </ul>
    <ul tpye="circle">
        <li>水果</li>
        <li>蔬菜</li>
        <li>肉类</li>
    </ul>
    <ul tpye="square">
        <li>水果</li>
        <li>蔬菜</li>
        <li>肉类</li>
    </ul>
    <ul tpye="none">
        <li>水果</li>
        <li>蔬菜</li>
        <li>肉类</li>
    </ul>
    <p>无序列表的嵌套</p>
    <ul>
        <li>水果
            <ul>
                <li>苹果</li>
                <li>香蕉</li>
                <li>橙子</li>
                <li>葡萄</li>
            </ul>
        </li>
        <li>蔬菜</li>
        <li>肉类</li>
    </ul>
</body>
</html>
