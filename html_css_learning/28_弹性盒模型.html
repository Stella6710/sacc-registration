<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: 300px;
            height: 300px;
            background-color: lightgray;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;

        }
        .box1 {
            width: 50px;
            height: 50px;
            background-color: red;
            flex: 1;
        }
        .box2 {
            width: 50px;
            height: 50px;   
            background-color: green;
            flex: 2;
        }
        .box3 {
            width: 50px;
            height: 50px;
            background-color: blue;
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
    </div>
</body>
</html>
