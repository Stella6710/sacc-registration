<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 打印1~100
        for(var i = 1; i<=100; i++){
            console.log(i);
        }
        
        // 打印小于10的正整数
        num = 10;
        for(var i = 1; i<num; ++i){
            console.log(i);
        }
    </script>
</body>
</html>
