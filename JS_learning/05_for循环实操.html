<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 计算1到100的和
        var result = 0;
        for(var num = 1; num<=100; num++){
            result += num;
        }
        console.log(result);

        // 循环1~1000的奇数
        // for(var i = 1; i<=1000; i+=2){
        //     console.log(i);
        // }
        for(var i = 0; i<=1000; i++){
            if(i%2==1){
                console.log(i);
            }
        }

        // 打印九九乘法表
        for(var i = 1; i<=9; i++){
            for(var j = 1; j<=i; j++){
                document.write(j + 'x' + i + '=' + i*j + " ");
            }
            document.write("</br>");
        }
    </script>
</body>
</html>
