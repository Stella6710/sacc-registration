<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 优点：事件不会被覆盖 -->
     <button id="btn">提交</button>
     <script>
        var btn = document.getElementById('btn');
        btn.addEventListener('click', function(){
            alert('报名成功1');
            alert('报名成功2');
        })
     </script>
</body>
</html>
