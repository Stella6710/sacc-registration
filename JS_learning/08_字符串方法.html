<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // .length           字符串长度 
        var str = 'kskbl';
        document.write(str.length);

        // .chartAt()        查找某个下标对应的字符 
        var str = 'kskbl';
        console.log(str.charAt(3));

        // .concat() 或 +    连接字符串 
        var str1 = 'hello';
        var str2 = 'world';
        var str3 = '!';
        var num = 100;
        var result = str1.concat(str2,str3,num);
        console.log(result);
        console.log(str1);
        console.log(str2);
        console.log(str3);
        console.log(num);
        console.log(typeof num);
        console.log(typeof result);

        // .substring()                  切割字符串 左闭右开
        var msg = 'sihfkjhskk';
        console.log(msg.substring(3,6));

        // .substr(开始位置, 切割长度)     切割字符串 
        var name = 'helloworld';
        console.log(name.substr(3, 5));

        // .indexOf("查找的字符串")        返回下标，未找到返回-1
        // .indexOf("a", 4)               从下标4开始找
        var msg = 'hello world';
        console.log(msg.indexOf('l'));

        // .trim()        去除字符串首尾的空格，制表符\t \v，换行符\n，回车符\r
        var msg = '     hello world    \t \r';
        console.log(msg.trim());

        // .split()        按方法分割字符串，返回数组
        var msg = 'he  llo|world';
        console.log(msg.split('|'));
        console.log(msg.split(''));    // 将字符串一个一个拆分，空格也算
        console.log(msg.split('', 5));// 数组只取前五个元素
        console.log(msg.split());    // 数组只有一个元素

    </script>
</body>
</html>
