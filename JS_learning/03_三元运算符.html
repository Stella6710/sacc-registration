<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <script>
        // 判断奇偶
        var num = 10;
        if(num % 2 == 0){
            console.log('偶数');
        }else{
            console.log('奇数');
        }

        var result = num % 2 == 0 ? '偶数' : '奇数';
        console.log(result);

    </script>
    
</body>
</html>
