<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 优点：HTML与js分离   缺点：只能执行一个事件 -->
    <button id="btn">提交</button>
    <script>
        var btn = document.getElementById('btn');
        btn.onclick = function(){
            alert('报名成功')
        }
    </script>
</body>
</html>
