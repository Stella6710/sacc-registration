<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <title>SACC科技创新大赛报名表</title>
    <style>
        body{
            background-color: rgb(241, 243, 245);
        }
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            width: 100%;
            height: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            animation: anim 5s ease-in-out 0s infinite
        }
        @keyframes anim{
            0% {
            background-color:rgb(249, 160, 7);
            }
            50% {
                background-color: rgb(253, 208, 7);;
            }
            100% {
                background-color:rgb(249, 160, 7);
            }
        }
        .text1{
            font-size: 30px;
            font-weight: 500;
            color: aliceblue;
            margin-top: 20px;
        }
        .text2{
            font-size: 12px;
            color: aliceblue;
            margin-bottom: 25px;
        }
        .message{
            height: 300px;
            width: 70%;
            background-color: rgb(255, 255, 255);
            border-radius: 6px;
            box-shadow: 10px 10px 10px gainsboro;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            margin: -12px auto;
        }
        .enter{
            height: 450px;
            width: 70%;
            background-color: rgb(255, 255, 255);
            border-radius: 6px;
            box-shadow: 10px 10px 10px gainsboro;
            position: relative;
            margin: 35px auto;
        }
        .head{
            font-size: 18px;
            font-weight: bold;
            color: darkorange;
            margin: 10px auto 0;
        }
        .content{
            font-size: medium;
            color:black;
            margin: 0px auto auto;
        }
        .msg{
            border-spacing: 70px 20px;
            margin: 0 auto;
        }
        .msg td{
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text1">SACC科技创新大赛报名</div>
        <div class="text2">南京邮电大学计算机学院科学技术协会</div>
    </div>
    <div class="message">
        <div class="head">
            比赛信息
        </div>
        <div class="content">
            <table class="msg">
                <tr>
                    <td>比赛名称: SACC科技创新大赛</td>
                    <td>主办单位: 计算机学院科学技术协会</td>
                </tr>
                <tr>
                    <td>比赛时间: 2026年9月15日</td>
                    <td>比赛地点: 南邮仙林校区计算机学科楼</td>
                </tr>
                <tr>
                    <td>面向对象: 南京邮电大学全体在校生</td>
                    <td>报名截止: 2026年9月10日23:59</td>
                </tr>
            </table>
        </div>

    </div>
    <div class="enter"></div>
</body>
</html>
